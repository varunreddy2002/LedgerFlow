[project]
name = "ledgerflow"
version = "0.1.0"
description = "LedgerFlow — CSV/PDF ingestion, categorization, and review API."
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.137.0",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",
    # Database
    "sqlalchemy==2.0.50",
    "alembic==1.18.4",
    "psycopg2-binary==2.9.12",
    # Settings / validation
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    # File / IO
    "aiofiles==25.1.0",
    "pymupdf==1.27.2.3",
    "httpx==0.28.1",
    # LLM / AI (LangChain 1.x)
    "langchain-core==1.4.7",
    "langchain-openai==1.3.2",
    "langchain-aws==1.5.1",
    "boto3==1.43.29",
    "docling>=2.106.0",
    "langgraph>=1.2.6",
    "langchain>=1.3.11",
    "reportlab>=5.0.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.3.4",
]

[tool.uv]
# This is an application, not a library — don't build/install the project itself.
package = false
